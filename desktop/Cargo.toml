[package]
name = "gamepad-desktop"
version = "0.1.0"
edition = "2024"

[features]
default = ["bundled-sdl"]
bundled-sdl = ["sdl3/build-from-source-static", "sdl3/build-from-source-unix-console"]

[dependencies]
image = { version = "0.25.10", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
sdl3 = "0.20.0"
sdl3-sys = { version = "0.7.1", features = [
  "no-default-subsystems",
  "sdl-joystick",
  "sdl-hidapi",
  "sdl-power",
  "sdl-sensor",
] }

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.13.2"
atspi = { version = "0.29", default-features = false, features = ["proxies", "zbus"] }
zbus = { version = "5", default-features = false, features = ["async-io"] }
futures-lite = "2"
async-io = "2"
bytemuck = "1.25"
egui-overlay = { package = "egui", version = "0.34", default-features = false, features = [
  "default_fonts",
] }
egui_software_backend = { version = "0.0.3", default-features = false, features = ["std"] }
rustix = { version = "1.1.5", features = ["event"] }
smithay-client-toolkit = "0.19.2"
wayland-client = "0.31"

[target.'cfg(target_os = "windows")'.dependencies]
enigo = { version = "0.6.1", default-features = false }
windows = { version = "0.62", features = [
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_Globalization",
  "Win32_UI_Accessibility",
  "Win32_Graphics_Gdi",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[dependencies.eframe]
version = "0.37"
default-features = false
features = ["accesskit", "default_fonts", "glow", "links", "wayland", "x11"]

[build-dependencies]
winres = "0.1.12"
