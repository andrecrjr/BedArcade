name: Desktop CI and Release

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libasound2-dev libudev-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libxinerama-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libegl1-mesa-dev libdbus-1-dev libatspi2.0-dev
      - run: cargo fmt --manifest-path desktop/Cargo.toml -- --check
      - run: cargo clippy --manifest-path desktop/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path desktop/Cargo.toml
      - run: cargo build --manifest-path desktop/Cargo.toml --release
      - name: Package Linux x64
        run: |
          mkdir -p desktop/dist
          tar -C desktop/target/release -czf desktop/dist/GamepadDesktop-Linux-x64.tar.gz gamepad-desktop
      - name: Upload Linux package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: GamepadDesktop-Linux-x64
          path: desktop/dist/GamepadDesktop-Linux-x64.tar.gz
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: cargo build --manifest-path desktop/Cargo.toml --release
      - name: Package Windows x64
        run: |
          New-Item -ItemType Directory -Force -Path desktop/dist | Out-Null
          Compress-Archive -LiteralPath desktop/target/release/gamepad-desktop.exe -DestinationPath desktop/dist/GamepadDesktop-Windows-x64.zip -Force
      - name: Upload Windows package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: GamepadDesktop-Windows-x64
          path: desktop/dist/GamepadDesktop-Windows-x64.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - build-linux
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Seed initial development release baseline
        run: |
          if ! git tag --list 'desktop-v*' | grep -q .; then
            git tag desktop-v0.0.0 "$(git rev-list --max-parents=0 HEAD)"
          fi
      - uses: actions/download-artifact@v8
        with:
          name: GamepadDesktop-Linux-x64
          path: desktop/dist
      - uses: actions/download-artifact@v8
        with:
          name: GamepadDesktop-Windows-x64
          path: desktop/dist
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Create semantic release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run release
